  name: Build and Quality Pipeline

  on:
    push:
      branches: [ "main", "develop" ]
    pull_request:
      branches: [ "main" ]
      types: [ opened, synchronize, reopened ]

  jobs:
    build-and-analyze:
      runs-on: ubuntu-latest
      permissions:
        contents: read

      services:
        postgres:
          image: postgres:16
          env:
            POSTGRES_DB: qualitrace
            POSTGRES_USER: root
            POSTGRES_PASSWORD: P@ssw0rd
          ports:
            - 5432:5432
          options: >-
            --health-cmd pg_isready
            --health-interval 10s
            --health-timeout 5s
            --health-retries 5

        redis:
          image: redis:7
          ports:
            - 6379:6379

      steps:
        - name: Checkout repository
          uses: actions/checkout@v6
          with:
            fetch-depth: 0 # Nécessaire pour SonarCloud

        - name: Set up JDK 25
          uses: actions/setup-java@v5
          with:
            java-version: '25'
            distribution: 'temurin'

        # Cache spécifique aux scanners SonarCloud (repris du modèle Sonar)
        - name: Cache SonarCloud packages
          uses: actions/cache@v6
          with:
            path: ~/.sonar/cache
            key: ${{ runner.os }}-sonar
            restore-keys: ${{ runner.os }}-sonar

        - name: Setup Gradle
          uses: gradle/actions/setup-gradle@v6

        - name: Build backend and Run Tests
          working-directory: backend
          env:
            SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/qualitrace
            SPRING_DATASOURCE_USERNAME: root
            SPRING_DATASOURCE_PASSWORD: P@ssw0rd
            SPRING_DATA_REDIS_HOST: localhost
            SPRING_DATA_REDIS_PORT: 6379
            SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
            SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
            SENTRY_DSN: ${{ secrets.SENTRY_DSN }}
          run: ./gradlew build jacocoTestReport

        - name: Analyze with SonarCloud
          if: secrets.SONAR_TOKEN != '' && secrets.SONAR_ORGANIZATION != '' && secrets.SONAR_PROJECT_KEY != ''
          working-directory: backend
          env:
            GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
            SONAR_ORGANIZATION: ${{ secrets.SONAR_ORGANIZATION }}
            SONAR_PROJECT_KEY: ${{ secrets.SONAR_PROJECT_KEY }}
          run: ./gradlew sonar